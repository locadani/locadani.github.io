<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-label="Diagram of the MailSense delivery pipeline: each of the development, staging and production branches maps to its own environment; a push runs GitHub Actions checks (.NET tests, Docker builds for the services that changed, database migration tests and frontend lint, typecheck and build), and only after every check passes Railway builds each service from its Dockerfile and deploys it to the Development, Staging or Production environment. Locally the whole stack runs in Docker Compose, with a mail server and object storage.">
  <title>MailSense: Delivery Pipeline</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52555c"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d5ab0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#fdfcfa"/>

  <text x="540" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600" fill="#1a1d23">MailSense: Delivery Pipeline</text>

  <rect x="40" y="100" width="300" height="330" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="190" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">Push to a branch</text>
  <text x="190" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">each branch is one environment</text>
  <line x1="60" y1="172" x2="320" y2="172" stroke="#ebedf0" stroke-width="1"/>
  <text x="60" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">development</text>
  <text x="60" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">Development environment</text>
  <line x1="60" y1="234" x2="320" y2="234" stroke="#ebedf0" stroke-width="1"/>
  <text x="60" y="260" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">staging</text>
  <text x="60" y="277" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">Staging environment</text>
  <line x1="60" y1="296" x2="320" y2="296" stroke="#ebedf0" stroke-width="1"/>
  <text x="60" y="322" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">production</text>
  <text x="60" y="339" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">Production environment</text>
  <rect x="440" y="100" width="600" height="180" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="740" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">GitHub Actions checks</text>
  <text x="740" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">on every pull request and push</text>
  <line x1="460" y1="172" x2="1020" y2="172" stroke="#ebedf0" stroke-width="1"/>
  <text x="460" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Backend</text>
  <text x="460" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">.NET tests for every service</text>
  <text x="740" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Docker</text>
  <text x="740" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">builds only the images that changed</text>
  <text x="460" y="248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Database</text>
  <text x="460" y="265" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">migration tests</text>
  <text x="740" y="248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Frontend</text>
  <text x="740" y="265" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">lint &#183; typecheck &#183; build</text>
  <rect x="440" y="340" width="600" height="140" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="740" y="375" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">Railway</text>
  <text x="740" y="395" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">builds each service from its Dockerfile and deploys it</text>
  <rect x="495" y="416" width="150" height="36" rx="8" fill="#fdfcfa" stroke="#dee0e4" stroke-width="1.2"/>
  <text x="570" y="439" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Development</text>
  <rect x="665" y="416" width="150" height="36" rx="8" fill="#fdfcfa" stroke="#dee0e4" stroke-width="1.2"/>
  <text x="740" y="439" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Staging</text>
  <rect x="835" y="416" width="150" height="36" rx="8" fill="#fdfcfa" stroke="#dee0e4" stroke-width="1.2"/>
  <text x="910" y="439" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Production</text>
  <line x1="344" y1="190" x2="436" y2="190" stroke="#52555c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="390" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">runs checks</text>
  <line x1="740" y1="280" x2="740" y2="336" stroke="#1d5ab0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="754" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d5ab0">deploys only after every check passes</text>
  <rect x="40" y="520" width="1000" height="80" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="540" y="558" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">Local development</text>
  <text x="540" y="580" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">the whole stack in Docker Compose, with a mail server and object storage</text>

</svg>
