<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" width="1080" height="660" role="img" aria-label="Diagram of the MailSense email pipeline: the email processor connects to a tenant mailbox using Outlook, Gmail, or generic IMAP/SMTP, stores data in per-tenant storage, and pushes each tenant's context to a single shared AI agent that classifies email and drafts replies using that pushed context instead of its own database.">
  <title>MailSense email pipeline architecture</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52555c"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d5ab0"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1080" height="660" fill="#fdfcfa"/>

  <!-- header -->
  <text x="540" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600" fill="#1a1d23">MailSense &#8212; Email Pipeline</text>

  <!-- ============ Mailbox box ============ -->
  <rect x="40" y="150" width="220" height="270" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="150" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">Mailbox</text>
  <text x="150" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">one provider per tenant</text>

  <line x1="60" y1="222" x2="240" y2="222" stroke="#ebedf0" stroke-width="1"/>

  <text x="60" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Outlook</text>
  <text x="60" y="267" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">Microsoft Graph API &#183; OAuth</text>

  <line x1="60" y1="284" x2="240" y2="284" stroke="#ebedf0" stroke-width="1"/>

  <text x="60" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Gmail</text>
  <text x="60" y="329" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">Gmail API &#183; OAuth</text>

  <line x1="60" y1="346" x2="240" y2="346" stroke="#ebedf0" stroke-width="1"/>

  <text x="60" y="374" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Generic IMAP/SMTP</text>
  <text x="60" y="391" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">read-only</text>

  <!-- ============ Email Processor box ============ -->
  <rect x="380" y="150" width="220" height="270" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="490" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">Email Processor</text>
  <text x="490" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">C# service</text>
  <text x="490" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">orchestrates mailbox I/O</text>

  <!-- ============ AI Agent box ============ -->
  <rect x="760" y="150" width="280" height="280" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="900" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">AI Agent</text>
  <text x="900" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">shared FastAPI service</text>
  <text x="900" y="221" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">one instance for all tenants</text>

  <line x1="790" y1="236" x2="1010" y2="236" stroke="#ebedf0" stroke-width="1"/>

  <text x="790" y="264" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Classifier</text>
  <text x="790" y="281" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">labels inbound email</text>

  <line x1="790" y1="298" x2="1010" y2="298" stroke="#ebedf0" stroke-width="1"/>

  <text x="790" y="326" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Drafter</text>
  <text x="790" y="343" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">drafts replies &#183; operator-reviewed</text>

  <!-- accent callout: the one architecturally interesting fact -->
  <rect x="780" y="368" width="240" height="46" rx="8" fill="#e5f1ff" stroke="#1d5ab0" stroke-width="1.2"/>
  <text x="900" y="387" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d5ab0">no database of its own &#8212;</text>
  <text x="900" y="403" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d5ab0">resolves everything from pushed context</text>

  <!-- ============ Tenant Data box ============ -->
  <rect x="460" y="530" width="460" height="90" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="690" y="568" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">Tenant Data</text>
  <text x="690" y="590" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">database + attachment storage, per tenant</text>

  <!-- ============ Arrows ============ -->

  <!-- Mailbox <-> Processor: reads & sends mail -->
  <line x1="264" y1="285" x2="376" y2="285" stroke="#52555c" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="320" y="275" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">reads &amp; sends mail</text>

  <!-- Processor -> Agent: pushes tenant context (the interesting fact, accent) -->
  <line x1="604" y1="235" x2="756" y2="235" stroke="#1d5ab0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="680" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d5ab0">email + tenant context, pushed per call</text>

  <!-- Agent -> Processor: returns classification / draft -->
  <line x1="756" y1="345" x2="604" y2="345" stroke="#52555c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="680" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">classification + draft reply</text>

  <!-- Processor -> Tenant Data: stores -->
  <line x1="490" y1="420" x2="490" y2="526" stroke="#52555c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="504" y="478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">stores mail &amp; attachments</text>

  <!-- Agent -> Tenant Data: reads/writes via pushed context (dashed, accent) -->
  <line x1="900" y1="430" x2="900" y2="526" stroke="#1d5ab0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="886" y="478" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1d5ab0">reads/writes via</text>
  <text x="886" y="493" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1d5ab0">pushed context</text>

</svg>
