<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-label="Diagram of the Customer Intelligence delivery pipeline: main deploys to Production by pull request and staging to Staging, with staging reset to match main after every merge; a push runs GitHub Actions checks (format, typecheck, lint, build and a Docker build for the app, ruff and an import check for the letter service, which must pass before merging), and only after every check passes Railway builds from the Dockerfile and deploys it. A weekly job cleans up old CI runs and artifacts.">
  <title>Customer Intelligence: Delivery Pipeline</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52555c"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d5ab0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#fdfcfa"/>

  <text x="540" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600" fill="#1a1d23">Customer Intelligence: Delivery Pipeline</text>

  <rect x="40" y="100" width="300" height="330" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="190" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">Push to a branch</text>
  <text x="190" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">each branch is one environment</text>
  <line x1="60" y1="172" x2="320" y2="172" stroke="#ebedf0" stroke-width="1"/>
  <text x="60" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">main</text>
  <text x="60" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">Production, by pull request</text>
  <line x1="60" y1="234" x2="320" y2="234" stroke="#ebedf0" stroke-width="1"/>
  <text x="60" y="260" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">staging</text>
  <text x="60" y="277" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">Staging, for testing changes</text>
  <rect x="50" y="302" width="280" height="46" rx="8" fill="#e5f1ff" stroke="#1d5ab0" stroke-width="1.2"/>
  <text x="190" y="321" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d5ab0">after every merge, staging</text>
  <text x="190" y="337" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d5ab0">is reset to match main</text>
  <rect x="440" y="100" width="600" height="180" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="740" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">GitHub Actions checks</text>
  <text x="740" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">on every pull request and push to main</text>
  <line x1="460" y1="172" x2="1020" y2="172" stroke="#ebedf0" stroke-width="1"/>
  <text x="460" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">App</text>
  <text x="460" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">format &#183; typecheck &#183; lint &#183; build</text>
  <text x="740" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">App image</text>
  <text x="740" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">Docker build</text>
  <text x="460" y="248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Letter service</text>
  <text x="460" y="265" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">ruff lint and format &#183; import check</text>
  <text x="740" y="248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Merge rule</text>
  <text x="740" y="265" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">letter service: checks must pass</text>
  <rect x="440" y="340" width="600" height="140" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="740" y="375" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">Railway</text>
  <text x="740" y="395" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">builds from the Dockerfile and deploys it</text>
  <rect x="580" y="416" width="150" height="36" rx="8" fill="#fdfcfa" stroke="#dee0e4" stroke-width="1.2"/>
  <text x="655" y="439" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Staging</text>
  <rect x="750" y="416" width="150" height="36" rx="8" fill="#fdfcfa" stroke="#dee0e4" stroke-width="1.2"/>
  <text x="825" y="439" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1d23">Production</text>
  <line x1="344" y1="190" x2="436" y2="190" stroke="#52555c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="390" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#52555c">runs checks</text>
  <line x1="740" y1="280" x2="740" y2="336" stroke="#1d5ab0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="754" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d5ab0">deploys only after every check passes</text>
  <rect x="40" y="520" width="1000" height="80" rx="10" fill="#f8f6f3" stroke="#dee0e4" stroke-width="1.5"/>
  <text x="540" y="558" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">On a schedule</text>
  <text x="540" y="580" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#86898f">weekly cleanup of old CI runs and artifacts</text>

</svg>
